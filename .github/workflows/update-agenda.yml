name: Rafraichir l'agenda

on:
  schedule:
    - cron: '23 * * * *'   # toutes les heures (~minute 23)
  workflow_dispatch:         # permet un lancement manuel (bouton "Run workflow")

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Telecharger et committer seulement si un evenement A VENIR change
        run: |
          curl -sSL --retry 3 "https://calendar.google.com/calendar/ical/bingodisco81%40gmail.com/public/basic.ics" -o agenda.new.ics

          # Garde-fou : si le flux recupere est invalide/vide, on ne touche a rien.
          if ! grep -q 'BEGIN:VCALENDAR' agenda.new.ics; then
            echo "Flux invalide, on conserve l'ancien agenda."
            rm -f agenda.new.ics
            exit 0
          fi

          # Ne committe QUE si un evenement a venir a change (ignore passe, ordre, DTSTAMP).
          if [ "$(python3 .github/scripts/agenda_changed.py)" = "SAME" ]; then
            echo "Aucun changement sur les evenements a venir."
            rm -f agenda.new.ics
            exit 0
          fi

          mv agenda.new.ics agenda.ics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agenda.ics
          git commit -m "Agenda : mise a jour auto (evenement a venir)"
          git push
